services:
  fruitflystock:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Google__ClientId: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      Google__ApiKey: ${GOOGLE_API_KEY:?Set GOOGLE_API_KEY in .env}
      Google__AppId: ${GOOGLE_APP_ID:?Set GOOGLE_APP_ID in .env}
